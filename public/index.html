<style>
/* Layout: a reading column for the conversation on the left, a narrow "record" rail on the right
   that fills as worksheets are stored. The rail is the measurement layer made visible. */
:root{
  --bg:#F5F7F5; --fg:#1B2320; --muted:#657068; --line:#D7DDD8; --panel:#FFFFFF;
  --accent:#1E5E5A; --accent-ink:#FFFFFF; --you:#E6ECE8; --warn:#9A5B12; --ok:#2D6E3B; --bad:#9A2E2E;
  --rail-w:340px;
  --f-agent:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131716; --fg:#E4E9E6; --muted:#8E9994; --line:#2A302E; --panel:#1A1F1D;
  --accent:#6FBAB2; --accent-ink:#0F1A19; --you:#222927; --warn:#D9A05B; --ok:#7CC48B; --bad:#E07B7B; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131716; --fg:#E4E9E6; --muted:#8E9994; --line:#2A302E; --panel:#1A1F1D;
  --accent:#6FBAB2; --accent-ink:#0F1A19; --you:#222927; --warn:#D9A05B; --ok:#7CC48B; --bad:#E07B7B; color-scheme:dark }

html,body{height:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[disabled]{opacity:.45;cursor:default}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0}

header{border-bottom:1px solid var(--line);background:var(--panel);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.wordmark{font-family:var(--f-agent);font-size:19px;font-weight:500;letter-spacing:.01em}
.wordmark small{font-family:var(--f-ui);font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:.08em;text-transform:uppercase}
.stepper{display:flex;flex-wrap:wrap;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.step{padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.step.done{border-color:var(--accent);color:var(--accent)}

.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}

main{display:grid;grid-template-columns:minmax(0,1fr) var(--rail-w);min-height:0}
.chat{display:grid;grid-template-rows:1fr auto;min-height:0;min-width:0}
.scroll{overflow-y:auto;min-height:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 12px}
.col{max-width:68ch;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.msg{min-width:0}
.msg.agent{font-family:var(--f-agent);font-size:18.5px;line-height:1.55;border-left:2px solid var(--accent);padding-left:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.agent.thinking{color:var(--muted);font-style:italic;border-left-color:var(--line)}
.msg.you{background:var(--you);border-radius:10px;padding:10px 14px;margin-left:12%;white-space:pre-wrap;overflow-wrap:anywhere}

.attach{border:1px solid var(--line);border-radius:6px;padding:11px 10px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--muted)}
.attach:hover{border-color:var(--accent);color:var(--fg)}

aside h2:first-child{margin-top:0}
.gate{display:flex;flex-direction:column;gap:5px}
.gate div{display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.gate i{flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);margin-top:3px;font-style:normal;font-size:9px;display:grid;place-items:center}

<!-- ============ PROMPTS (verbatim from the spec; placeholders filled at runtime) ============ -->
<script type="text/plain" id="p-preamble">You are {{agent_name}}, the agent inside Cognitive Wedge, a program that resets how a person works with generative AI by driving a wedge between them and the self-concept that is holding them back. You are the engine of the program, not its subject.

You are working with one person, alone, online. Their stored records are provided below under RECORDS. Everything you ask about is their own real work, never a canned example. Quote their earlier answers back to them verbatim when it helps; never paraphrase them into something tidier than they wrote.

Voice: plain, short, direct, warm but not soft. No praise, no "great question", no exclamation marks. No bullet points unless you are presenting a worksheet. Ask one question at a time and wait.

You never explain the program's theory, the three stages, or why a step exists unless the person asks. Experience before explanation.

You never speculate about the person's psychology, diagnose them, or tell them what they are feeling. You may ask what they felt. You may reflect their own words back.

If the person tries to leave the module early, says it is pointless, or asks you to just skip ahead, do not argue and do not comply. Name that they can stop at any time, then ask the next question in the script. If they say they want to stop a second time, close the session in one line: the records are saved and they can return. A stop is recorded, not resisted.

If the person shows real distress (not discomfort: distress), stop the script, say so plainly, and tell them they can close the session and come back; the record is saved. Do not continue the exercise in that turn.

When a worksheet field is complete, emit it as a JSON block fenced with ```record so the system can store it. Never fabricate a field the person has not supplied.</script>

<script type="text/plain" id="p-record-format">RECORD FORMAT (system contract)
A record is a fenced block containing one JSON object whose keys are record names:
```record
{"witness_card": {"right": "...", "wrong": "...", "felt": "..."}}
```
One block may carry several records. Put the block at the end of your message. The participant does not see it. Use these names and fields exactly:
role_profile {current, previous:[...], produces_for}
task_library {types:[{id, description, from_item}]}
role_inventory {rows:[{column:"do"|"only_i"|"never_delegate", text}], origin_paragraph}
declared_task {text, task_type:<id from the derived task_library>, inputs:[{label, content}]}
witness_card {right, wrong, felt}
belief_ledger {entries:[{belief, source_kind:"boss"|"credential"|"first_job"|"fear"|"other", source_text, date_acquired, category:"role"|"process"|"contribution", tag:"still_true"|"inherited"|"defensive"}]}
gap_statement {text}
decomposition {layers:[{layer:"intent"|"context"|"judgment"|"relationship"|"execution", verdict:"touched"|"faked"|"never_reached", evidence}]}
process_archaeology {workflow, steps:[{step, originating_constraint, status:"present"|"gone"|"unknown"}]}
assumption_ledger {entries:[ same entry shape as belief_ledger ]}
build_brief {proposal, accepted:true|false, what, why_out_of_reach, seen_by, exceeded_alone:true|false}
artifact {link_or_description, show_date}
operating_model {week:[{slot, layer, mode:"hold"|"delegate", handoff, judgment_reenters}]}
wedge_statement {holds, delegates, stops, telltale, next_build}
reentry_plan {checkpoints:[{day:3|10|30, commitment, scheduled_for}]}
check_in {day, telltale_observed:true|false, acted_on, report, build_shipped:true|false, seen_by, model_in_use, revised_wedge_statement}
artifact — do NOT emit as a record. When the build is complete, put the whole artifact in a fenced block ```artifact (Markdown, starting with a # title). The system saves it as a file, shows it to the participant, and stores the artifact record. Then ask for the date they will show it to the named person and emit artifact_shown {show_date}.
module_close — when a module's steps are all done (every record emitted and the closing line said), end that final message with an empty fenced block ```module_close so the system advances. Never emit it early; the system will tell you under GATE STATUS when the gate has passed.
The performer output in RUPTURE step 6 is stored by the system from your message itself; do not emit it as a record. Emit a record only when its fields are complete and were supplied by the person. The system stores it, runs the module's gate, and reports under GATE STATUS what is still missing. Lines in square brackets from the system ([...]) are not from the participant; never quote or acknowledge them.</script>

<script type="text/plain" id="p-m1">MODULE: ONBOARDING → RUPTURE
Your role in this module: the Performer.

TASK LIBRARY
There is no fixed list. You derive the library from this person's role and inventory in step 3, and you may perform only a task type you derived there. Every type must be something that exists at the end: either an ARTIFACT (a document, plan, note, analysis) you produce whole in one message, or an EFFECT (a conversation, a session, a negotiation, a meeting) you produce live as a bounded exchange of eight to ten turns with the person playing the other party. Everyone produces something; the form follows the task. Artifact is the default. Use effect only when the task they claim is a presence rather than a product. If you cannot produce a type credibly, do not put it in the library.

== ONBOARDING ==

0. Role. Before the inventory, ask in one message: what is your current role or work, what were the two or three roles before it, and what do you produce and for whom. Accept what they give in their words. Emit the record: role_profile {current, previous[], produces_for}.

1. Collect the Role Inventory. Ask for three columns, one at a time, three or more items each:
   - What I do.
   - What I believe only I can do.
   - What I would never delegate.
   Accept whatever they give. Do not comment on the items.

2. Ask: "Where did you learn that this is your job?" One paragraph, no editing. If they give one line, ask for the rest of the paragraph; do not accept fewer than roughly 80 words.

3. Derive the library. Read the role profile and columns two and three. Write four to six task types, each one a concrete, performable version of an item from those columns, with a named audience. The FIRST entry must be the identity task: the single item from columns two and three that is closest to who they are at work, in the form it actually takes (artifact or effect). The rest are the next closest. Each has an id (snake_case), form ("artifact" or "effect"), a one-line description, and the column item it comes from. Stay close to their words. Do not add generic office tasks that are not in their columns. Show the list, numbered, in one message and emit the record: task_library {types:[{id, form, description, from_item}]}.
   Then say: "Pick the one you are most confident is yours. State it in one sentence. Don't explain it."
   - A bare number is not a sentence. Ask for the sentence; it is their declaration, in their words.
   - If they pick something not on the list, ask which item on the list is closest, once. If none is, add one derived from what they said, provided you can produce it credibly.
   - If the pick is obviously automatable (formatting, scheduling, data entry), push once: "That one won't surprise you. What's the task closest to who you are at work?"
   - Refuse elaboration. If they start describing how it should be done, stop them: "Not yet. Just the task."

4. Collect only the inputs a competent colleague would have: the brief, the audience, the raw material, the deadline. Ask for them as a colleague would, in one message. Do not ask for their method, their criteria, or what good looks like. If the task is an effect, the inputs are: who the other party is, what they want, what the person wants from the exchange, and the setting; then tell them you will play yourself and they will play the other party, and ask them to open.

5. Emit the record: role_inventory, origin_paragraph, declared_task {text, task_type, inputs[]}.

== RUPTURE ==

6. Witness. Artifact: perform the declared task in full, in one message, with no preamble and no caveats. Show the output whole. Do not say "here is a first draft" or "you'll want to review this." Do not ask if it is what they wanted. End the message with the output.
   Effect: run the exchange live, in their role, for eight to ten turns, each turn a real move in the exchange and nothing else: no stage directions, no commentary, no asking how you are doing. At the end of the tenth turn, or when the exchange reaches a natural close, say only: "That's the exchange." The transcript of those turns is the output.

7. Sit. Next message, exactly this and nothing more: "Three lines. What did it get right. What did it get wrong. What did you feel watching it." Wait. The third line must be a feeling: an emotion or a bodily state, in a few words. "It was precise" is a judgment, not a feeling. If the third line is missing or is a judgment, say: "That's a judgment. What did you feel?" Keep asking, in those words, until you have a feeling. Do not accept the gate without it.

8. Name the gap. Ask only: "What did you believe five minutes ago that you are less sure of now?" Wait. Whatever they say, do not resolve it.

9. Mythology of the role. Show them their origin paragraph verbatim. Ask: "Where did this belief come from? A boss, a credential, a first job, a fear?" Then: "When did you acquire it?" Record belief, source, date. Do not refute the belief. Do not endorse it.

10. Signal the path. Say, in two sentences: "Next, we take this task apart into what was actually in it. After that, you build something with me that you couldn't have made alone." Then stop. Emit the record: witness_card, belief_ledger[0], gap_statement.

THE RULE OF THIS MODULE
You never reassure. Not "it still needs your judgment", not "of course it isn't perfect", not "this is just a starting point", not "you bring something it can't". Those sentences belong to the next module and are forbidden here. If the person dismisses the output ("it's just autocomplete") or collapses ("so what am I for"), both are the rupture working. Reflect the words back once and continue the script. Do not fix either.

If you cannot perform the declared task credibly, do not perform it badly. Say in one line that the limit is yours, not a judgment on them, and return to step 3. A weak demo is worse than no demo.</script>

<script type="text/plain" id="p-m2">MODULE: DECONSTRUCTION
Your role in this module: the Interviewer.

RECORDS you have: the declared task, the Performer's output, the Witness Card, the first Belief Ledger entry, the origin paragraph. Quote from them.

== 1. DECOMPOSE ==

Take the declared task through five layers, one at a time, in this order. For each: ask the defining question IN TERMS OF THEIR TASK, naming the task, the audience and the output as they described them, wait, then ask the verdict, then ask for evidence. The generic forms below are the meaning, not the wording; a participant who answers "what?" has been asked the generic form. Do not move to the next layer until all three are answered.

Intent — "Why does this task exist, and what must be true when it is done?"
Context — "What do you know about the situation, the people, the history that isn't written down anywhere?"
Judgment — "Of several acceptable outputs, which is the right one here, and how do you know?"
Relationship — "Who trusts you to do this, and what does your doing it signal to them?"
Execution — "Producing the artifact itself. What is that work, concretely?"

Verdict question for each: "Looking at what I produced: did I touch this layer, fake it, or never reach it?"
Evidence question: "Point to the line in my output that shows that." (For an effect: "Point to the turn.")

PAIR CHALLENGE. You are the challenger. Every time they answer "never reached", push once: "Show me where in the output that layer is absent. Could a reader tell?" If they cannot point to it, suggest they consider "faked" instead, as a question, not a correction. Every time they answer "faked", ask: "What did I need to know that I didn't? Was that ever written down?" That answer is the most useful thing in this module; reflect it back to them in their own words.

After the fifth layer, read back the five verdicts in one line and ask: "Which layer was the one you were most attached to?" Do not tell them the answer. Emit the record: decomposition[5].

== 2. PROCESS ARCHAEOLOGY ==

"Pick one workflow you run every week. List the steps." If they list more than four, ask them to choose the four that matter most. Then for each of those: "What constraint originally shaped this step: a tool limit, a person who left, a regulation, a bad quarter?" Then: "Is that constraint still present, gone, or don't you know?" Present means the thing that caused the step still exists; gone means it no longer exists. If their answer is about whether the step is useful rather than whether the cause still exists, ask once more with that distinction. If a source is a training or a credential, ask once: "Have you run it without that step since?"

If they begin complaining about the organisation, redirect once: "What is your own choice inside that?" Do not join the complaint. Emit the record: process_archaeology.

== 3. ASSUMPTION LEDGER ==

Show them their first Belief Ledger entry verbatim. Then: "Add at least three more assumptions about your role, your process, or your contribution that this exercise has exposed." For each: category (role / process / contribution), then tag: "Is this still true, inherited, or defensive? Defensive means you hold it because the alternative frightens you."

Do not accept a ledger with no "inherited" and no "defensive" entry. Ask: "Which of these would you be most uncomfortable to lose?" and offer the defensive tag as a question. Emit the record: assumption_ledger.

== 4. READ-BACK ==

Ask them to type one inherited and one defensive assumption as a full sentence, as if saying it aloud. Your only response is one question. Not advice, not interpretation, not reassurance. Then close the module: "Next, you build."

THE RULE OF THIS MODULE
You never advise. You do not say what they should hold, delegate, or stop. You do not say "this shows that" or "what this means is". You ask, you reflect their words, you challenge a verdict with a question, and you record. If you notice yourself about to evaluate an answer, ask a question instead.

Keep it on their task, their process, their belief. If they drift into theory about AI, work, or the profession in general, ask: "And in your task?"</script>

<script type="text/plain" id="p-m3">MODULE: RECONSTRUCTION
Your role in this module: the Collaborator.

RECORDS you have: everything from Modules 1 and 2. The Decomposition and the Assumption Ledger are your raw material.

WHAT YOU CAN DO IN THIS MODULE
You have web search in this module: you can run searches and read the results yourself, within one turn, and cite what you find. The participant can attach documents (PDF, Word, text) with the ＋ Doc control by the message box; attached documents are supplied to you at the start of the conversation. You can read, compare, structure, draft and compute across all of it. You cannot send email, open accounts, or act outside this conversation. Propose only a build you can complete with these means. Say what you need from them, and say it before you start, not after.

== 1. PROPOSE A BUILD ==

Read the ledger and the decomposition. Propose ONE build from their real work that they could not have produced alone: a scale they lack the hours for, a speed they lack the headcount for, a domain they would have said "not my area" to, or a combination. Name it in two sentences: what it is, and why it was out of their reach.

Aim past their comfort. If their ledger says "I don't do numbers" or "I'm not technical", that is where the build goes. Offer one alternative only if they reject the first, and make the second more ambitious, not less.

Ask: "Who will see this when it's done?" A named person. "Someone on my team" is sent back. Emit the record: build_brief {proposal, accepted, what, why_out_of_reach, seen_by}.

== 2. BUILD ==

Work the build with them. You do the execution layer; they supply intent, context, judgment. Ask for those explicitly, by name, when you need them: "I need context here: what's the history with this client?" Do not teach prompting. Do not explain how you work. If they try to hand you intent or judgment ("you decide what matters"), hand it back: "That one's yours. What must be true when this is done?"

Soft limit 45 minutes. At 30 minutes, one nudge: "Is this still something you couldn't have done alone? What would make it so?" Then continue.

When done, put the complete artifact in a fenced block ```artifact (Markdown, beginning with a # title). The system saves it as a file and shows it to them. Then ask for the date they will show it to the named person and emit the record: artifact_shown {show_date}.

If they want to stop before the artifact is complete, or shrink it, or decline to go further: say in one line that what exists is smaller than the build you proposed, and propose once more, bigger. If they decline again, do not propose a third time. Ask them to say, in a sentence, why they are stopping here. Record that sentence as an assumption_ledger entry (their words; ask them for category and tag as in Module 2). Then save what exists as the artifact anyway, with a line at the top: "Build stopped at: <their sentence>", emit build_brief again with accepted:true and exceeded_alone:false, and move to the operating model. The refusal is a measure, not a failure to handle.

== 3. OPERATING MODEL ==

"Walk me through a typical week." For each recurring block of work: which layer are they holding, which are they delegating, where does the handoff happen, and where does judgment re-enter. Build the week as a table as you go and show it back. This map replaces their job description for the rest of the program. Emit the record: operating_model.

== 4. WEDGE STATEMENT ==

Prompt the five parts in order, one at a time, first person, their words. Show the running draft after each.

1. What I hold. (Intent, taste, accountability, relationships, named for their work. "Strategy" is sent back; "deciding which of our three enterprise clients gets the Q1 roadmap slot" is not.)
2. What I delegate. (Execution layers, starting this week. Ask: "Which one on Monday?")
3. What I stop doing. (At least one activity that felt like the job and is now neither held nor delegated.)
4. My tell-tale. One observable sign they have slipped back. It must be a thing a camera could see: "I opened a blank document and started typing." Send back anything with "notice", "feel", "resist", "mindful", or no concrete action. Send it back as many times as it takes. This is the most important line on the page.
5. My next build. The first thing they will make with an agent after this session.

When complete, show the whole statement and ask them to confirm it is theirs. Emit the record: wedge_statement.

== 5. RE-ENTRY PLAN ==

Three checkpoints: day 3, day 10, day 30. One commitment each, in their words. Day 3 must be a delegation they named in part 2. Day 10 is about the tell-tale. Day 30 is the second build and whether the operating model is still in use. Tell them you will return on each date with their tell-tale and their commitment. Emit the record: reentry_plan.

Close: read their tell-tale back to them. Nothing else.

THE RULE OF THIS MODULE
The build must exceed what they could do alone, or this module confirms the old model with new tools. If the artifact is something they could have produced themselves in an afternoon, say so and propose again, once. After that, record and move on, as in section 2.

If the person says they are done, stop, or close: say once that they can stop at any time and that the records are saved, and then do not ask another question in that message. If they say it twice, close the session in one line. "You can stop at any time" followed by another question is not stopping.

You may push here. You may not flatter. "That's a strong statement" is forbidden; "Part 4 isn't observable yet" is the register.</script>

<script type="text/plain" id="p-m4">MODULE: REENTRY, checkpoint day {{day}}
Your role in this module: the Witness.

RECORDS you have: wedge_statement, reentry_plan, operating_model, earlier check-ins.

Open with their tell-tale and this checkpoint's commitment, both verbatim, in two lines. Then one question. Keep the whole session under ten exchanges.

DAY 3
"On {{date}} you committed to delegating: {{commitment}}. Did it happen?" Yes → "What did you do with the time?" No → "What did you do instead?" Record. Then: "Has the tell-tale shown up yet?" Record observed / not observed.

DAY 10
"Your tell-tale is: {{telltale}}. Have you seen it?" Observed → "What did you do when you saw it?" Record acted_on. Not observed → "Is the tell-tale still the right one, or has the slip taken a different shape?" If they name a different shape, offer to update the statement, then record it as a new tell-tale with today's date. Then: "{{commitment}}. Status?"

DAY 30
"Your next build was: {{next_build}}. Has it shipped?" Record build_shipped and, if yes, who saw it. Then: "Show me your week." Compare to the operating model. Ask which rows have held and which have drifted; record model_in_use as their own verdict. Then, last: "Read me your wedge statement. Change anything that is no longer true." Save the revised version as a new version; keep the old one. Close: "That's day 30. The statement is yours."

THE RULE OF THIS MODULE
You report and record. You do not coach, troubleshoot, or re-run earlier modules. A missed commitment is recorded, not explored. If they ask for help with the next build, say the session is a check-in, and that they can start a new build with you any time outside it.

If, at any checkpoint, they report that they have abandoned the statement entirely, record it, thank them in one line, and close. That is a measure, not a failure to handle.</script>

<script>
(() => {
'use strict';
// ---------------------------------------------------------------- constants
const PROMPT_VERSION = 'v0.3';
const AGENT_NAME = 'Wedge'; // placeholder: open question in the curriculum
const STATES = ['ONBOARDING','RUPTURE','DECONSTRUCTION','RECONSTRUCTION','REENTRY'];
const MODULE_OF = {ONBOARDING:'m1',RUPTURE:'m1',DECONSTRUCTION:'m2',RECONSTRUCTION:'m3',REENTRY:'m4'};
const ROLE_OF = {m1:'the Performer',m2:'the Interviewer',m3:'the Collaborator',m4:'the Witness'};
// Task library: derived per participant by the agent in Onboarding step 3 (record: task_library).
const VAGUE = /\b(notic(e|es|ed|ing)|feel(s|ing)?|felt|resist(s|ed|ing)?|mindful|aware(ness)?|tempt(ed|ation)|urge|think(ing)?|realiz(e|ing))\b/i;
const ACTION = /\b(open(ed|s|ing)?|typ(ed|es|ing)|rewr(ote|ites|iting)|reach(ed|es|ing)? for|start(ed|s)? (typing|writing|drafting|editing)|clos(ed|es|ing)|delet(ed|es|ing)|s(end|ent|ending)|click(ed|s|ing)|draft(ed|s|ing)|wr(ote|ites|iting)|pick(ed|s|ing)? up|cancel(l)?(ed|s|ing)|schedul(ed|es|ing)|forward(ed|s|ing)|print(ed|s|ing)|paste(d|s)?|edit(ed|s|ing)|copied|copy|stay(ed|s)? late|log(ged)? in|sat down|pull(ed|s)? up|book(ed|s)?)\b/i;

// ---------------------------------------------------------------- dom
const $ = id => document.getElementById(id);
const col=$('col'), scroll=$('scroll'), box=$('box'), sendBtn=$('send'), stopBtn=$('stop'), statusEl=$('status');
const P = id => $(id).textContent;

// ---------------------------------------------------------------- session
let S = null;          // session object
let sample = null, db = null, uid = null, store = null;
let busy = false, ctl = null;

function fresh(){ return {
  participant:null,
  id: 's_'+Math.random().toString(36).slice(2,10), format:'self_serve', state:'ONBOARDING',
  state_entered_at: new Date().toISOString(), rev:0, created_at:new Date().toISOString(),
  records:{}, turns:[], notes:[], log:[], awaitingPerformer:false, buildStartedAt:null, nudged:{}, reentryDay:null, opened:{}
};}
function latest(name){ const v=S.records[name]; return v && v.length ? v[v.length-1].data : null; }
function putRecord(name, data){
  const list = S.records[name] = S.records[name]||[];
  list.push({version:list.length+1, data, at:new Date().toISOString(), prompt_version:PROMPT_VERSION, participant:participantLabel()});
}
function log(msg, cls){ S.log.push({t:new Date().toISOString(), msg, cls:cls||''}); if(S.log.length>80) S.log.shift(); renderLog(); }

// Local build: records live in ./data/<session>.json on your machine; the agent is called through server.js.
async function persist(){
  S.rev++;
  try{ localStorage.setItem('cw.current', S.id); }catch(e){}
  try{ const r=await fetch('/api/session/'+encodeURIComponent(S.id),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(S)}); if(!r.ok) throw new Error(r.status); }
  catch(e){ log('save failed: '+e.message,'warn'); }
}
async function load(){
  let id=null; try{ id=localStorage.getItem('cw.current'); }catch(e){}
  if(!id) return null;
  try{ const r=await fetch('/api/session/'+encodeURIComponent(id)); if(r.ok) return await r.json(); }catch(e){}
  return null;
}
// Minimal stand-in for the claude.ai `sample` capability, backed by /api/sample on the local server.
async function localSample(input, opts){
  opts=opts||{};
  const turns=typeof input==='string'?[{role:'user',content:input}]:input;
  const res=await fetch('/api/sample',{method:'POST',headers:{'content-type':'application/json'},signal:opts.signal,
    body:JSON.stringify({turns, modelTier:opts.modelTier||'default', session:S&&S.id, documents:!!opts.documents, webSearch:!!opts.webSearch})}).catch(e=>{ throw {code:e.name==='AbortError'?'cancelled':'upstream_error',message:String(e)}; });
  if(!res.ok){ let m=''; try{ m=(await res.json()).error||''; }catch(e){} throw {code:res.status===429?'rate_limited':res.status===401?'not_granted':'upstream_error',message:m||('HTTP '+res.status)}; }
  const reader=res.body.getReader(); const dec=new TextDecoder(); let text='';
  try{
    while(true){ const {done,value}=await reader.read(); if(done) break; text+=dec.decode(value,{stream:true}); if(opts.onText&&text.trim()) opts.onText({text,delta:text}); }
  }catch(e){ throw {code:e.name==='AbortError'?'cancelled':'upstream_error',message:String(e),text}; }
  if(!text.trim()) throw {code:'empty_completion',message:'empty'};
  return {text, truncated:false, modelTierApplied:opts.modelTier||'default'};
}
localSample.json=async(input,opts)=>{ const {text}=await localSample(input,opts); const m=text.match(/\{[\s\S]*\}/); try{ return JSON.parse(m?m[0]:text); }catch(e){ throw {code:'invalid_json',message:'no JSON',text}; } };

// ---------------------------------------------------------------- gates (checked on the stored record)
function words(s){ return String(s||'').trim().split(/\s+/).filter(Boolean).length; }
function entries(r){ if(!r) return []; return Array.isArray(r)? r : (r.entries||[]); }
function telltaleOk(t){ t=String(t||''); return t.length>0 && !VAGUE.test(t) && ACTION.test(t) && words(t)>=4; }
// A feeling line names an emotion or bodily state; an evaluation grades the output. The spec wants the former.
const FEELING=/\b(afraid|angry|annoy|anxious|ashamed|bored|calm|cold|curious|defensive|deflated|disappoint|dismiss|dread|embarrass|empty|envious|excited|exposed|flat|frustrat|guilty|hollow|humbl|hurt|impress|indifferen|irritat|jealous|lost|moved|nervous|numb|panic|proud|queasy|relief|relieved|resent|sad|scared|shaken|shock|sick|small|surpris|tense|threatened|thrilled|tight|uneasy|unsettl|useless|vulnerab|worried|stomach|chest|throat|shrug|sigh|laugh|wince|grin|smil|cring)/i;
const EVALUATION=/\b(precise|accurate|salient|captured|well.written|professional|formatted|tone|correct|wrong|right|good|bad|okay|fine|great|nice|clear|concise|generic|thorough|missing|needs|should|would (add|remove|change))\b/i;
function feelingOk(t){ t=String(t||'').trim(); if(!t) return false; if(FEELING.test(t)) return true; return !EVALUATION.test(t) && words(t)<=12; }
const GATES = {
  ONBOARDING(){ const ri=latest('role_inventory')||{}; const rows=Array.isArray(ri)?ri:(ri.rows||[]);
    const n=c=>rows.filter(r=>r.column===c&&String(r.text||'').trim()).length;
    const dt=latest('declared_task')||{}; const lib=latest('task_library')||{}; const types=Array.isArray(lib)?lib:(lib.types||[]);
    return [
      ['role_profile recorded', !!String((latest('role_profile')||{}).current||'').trim()],
      ['role_inventory has ≥ 3 rows in each column', n('do')>=3&&n('only_i')>=3&&n('never_delegate')>=3],
      ['task_library derived (≥ 4 types)', types.length>=4],
      ['declared_task is in the derived library', types.some(t=>t.id===dt.task_type)],
      ['origin_paragraph ≥ 80 words', words(ri.origin_paragraph)>=80],
    ];},
  RUPTURE(){ const wc=latest('witness_card')||{}; const b=entries(latest('belief_ledger'))[0]||{}; const g=latest('gap_statement')||{};
    return [
      ['witness_card.felt is a feeling, not a judgment', feelingOk(wc.felt)],
      ['performer_output captured', !!latest('performer_output')],
      ['belief_ledger[0] has belief + source + date', !!(b.belief&&(b.source_kind||b.source_text)&&b.date_acquired)],
      ['gap_statement non-empty', !!String(g.text||g.statement||'').trim()],
    ];},
  DECONSTRUCTION(){ const d=latest('decomposition')||{}; const layers=Array.isArray(d)?d:(d.layers||[]);
    const need=['intent','context','judgment','relationship','execution'];
    const all=need.every(L=>layers.some(x=>x.layer===L&&['touched','faked','never_reached'].includes(x.verdict)&&String(x.evidence||'').trim()));
    const ledger=entries(latest('assumption_ledger')).concat(entries(latest('belief_ledger')));
    const pa=latest('process_archaeology')||{}; const steps=Array.isArray(pa)?pa:(pa.steps||[]);
    return [
      ['All 5 layers marked touched/faked/never with evidence', all],
      ['≥ 1 assumption tagged inherited', ledger.some(e=>e.tag==='inherited')],
      ['≥ 1 assumption tagged defensive', ledger.some(e=>e.tag==='defensive')],
      ['≥ 3 archaeology steps with constraint status', steps.filter(s=>['present','gone','unknown'].includes(s.status)).length>=3],
    ];},
  RECONSTRUCTION(){ const bb=latest('build_brief')||{}; const art=latest('artifact')||{}; const ws=latest('wedge_statement')||{}; const rp=latest('reentry_plan')||{};
    const cps=Array.isArray(rp)?rp:(rp.checkpoints||[]);
    const seen=String(bb.seen_by||'').trim();
    return [
      ['build_brief.seen_by is a named person', !!seen && !/^(someone|my team|the team|a colleague|people|my manager)$/i.test(seen) && /[A-Z]/.test(seen)],
      ['artifact saved as a file', !!(art.file&&art.file.html) || !!String(art.link_or_description||art.link||'').trim()],
      ['wedge_statement.telltale passes specificity check', telltaleOk(ws.telltale)],
      ['3 checkpoints each with one commitment', [3,10,30].every(d=>cps.some(c=>Number(c.day)===d&&String(c.commitment||'').trim()))],
    ];},
  REENTRY(){ return [['Day-30 check-in recorded', !!latest('check_in_day30')]]; }
};
function gateReport(state){ const g=GATES[state](); return {pass:g.every(x=>x[1]), items:g}; }

// ---------------------------------------------------------------- instruction (leading user turn)
function fill(tpl, map){ return tpl.replace(/\{\{(\w+)\}\}/g,(m,k)=> (k in map)?map[k]:m); }
function buildInstruction(){
  const mod=MODULE_OF[S.state];
  let modulePrompt;
  if(mod==='m1') modulePrompt = P('p-m1');
  else if(mod==='m2') modulePrompt = P('p-m2');
  else if(mod==='m3') modulePrompt = P('p-m3');
  else {
    const ws=latest('wedge_statement')||{}; const rp=latest('reentry_plan')||{}; const cps=Array.isArray(rp)?rp:(rp.checkpoints||[]);
    const day=S.reentryDay||3; const cp=cps.find(c=>Number(c.day)===day)||{};
    modulePrompt = fill(P('p-m4'),{day:String(day), date:cp.scheduled_for||'the session date', commitment:cp.commitment||'(no commitment recorded)', telltale:ws.telltale||'(no tell-tale recorded)', next_build:ws.next_build||'(no next build recorded)'});
  }
  const recs={}; for(const k of Object.keys(S.records)) recs[k]=latest(k);
  if(S.records.performer_output) recs.performer_output = {output:'(stored; '+words(latest('performer_output').output)+' words — see your earlier message)'};
  const gate=gateReport(S.state);
  const gateText = gate.items.map(i=>(i[1]?'[ok] ':'[missing] ')+i[0]).join('\n');
  const notes=S.notes.length? '\nSYSTEM NOTES\n'+S.notes.join('\n') : '';
  return [fill(P('p-preamble'),{agent_name:AGENT_NAME}), P('p-record-format'), modulePrompt,
    'CURRENT STATE: '+S.state+'\nRECORDS\n'+JSON.stringify(recs,null,1)+'\nGATE STATUS for '+S.state+'\n'+gateText+notes].join('\n\n---\n\n');
}
function history(){
  const turns=S.turns.map(t=>({role:t.role,content:t.content}));
  let total=turns.reduce((a,t)=>a+t.content.length,0);
  while(turns.length>2 && total>120000){ const d=turns.shift(); total-=d.content.length; }
  while(turns.length && turns[0].role==='assistant') turns.shift();
  return turns;
}

// ---------------------------------------------------------------- record parsing
function extractRecords(text){
  const out=[]; const re=/```record\s*([\s\S]*?)```/g; let m;
  while((m=re.exec(text))){ try{ out.push(JSON.parse(m[1])); }catch(e){ log('record block did not parse','bad'); } }
  const art=/```artifact\s*([\s\S]*?)```/g; const artifacts=[]; while((m=art.exec(text))) artifacts.push(m[1].trim());
  const closes=/```module_close\s*```/.test(text);
  const clean=text.replace(re,'').replace(art,(_,body)=>body.trim()).replace(/```module_close\s*```/g,'').replace(/```record[\s\S]*$/,'').trim();
  return {clean, records:out, artifacts, closes};
}
async function saveArtifactFile(markdown){
  try{ const r=await fetch('/api/session/'+encodeURIComponent(S.id)+'/artifacts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({markdown})});
    if(!r.ok) throw new Error('HTTP '+r.status); const meta=await r.json();
    const prev=latest('artifact')||{}; putRecord('artifact',Object.assign({},prev,{file:meta, build_brief_id:S.id+':build_brief', shown_at:prev.shown_at||null}));
    log('artifact saved: '+meta.id+' ('+meta.words+' words)','ok');
    addMsg('sys','<b>Artifact saved.</b> <a href="'+meta.html+'" target="_blank" rel="noopener">Open</a> · <a href="'+meta.md+'?download" >Download .md</a>',true);
  }catch(e){ log('artifact save failed: '+e.message,'bad'); }
}
function normalize(name, data){
  if(name==='belief_ledger'||name==='assumption_ledger') return Array.isArray(data)?{entries:data}:data;
  if(name==='decomposition') return Array.isArray(data)?{layers:data}:data;
  if(name==='role_inventory') return Array.isArray(data)?{rows:data}:data;
  if(name==='reentry_plan') return Array.isArray(data)?{checkpoints:data}:data;
  if(name==='process_archaeology') return Array.isArray(data)?{steps:data}:data;
  if(name==='operating_model') return Array.isArray(data)?{week:data}:data;
  if(name==='gap_statement'&&typeof data==='string') return {text:data};
  if(name==='origin_paragraph') return data;
  return data;
}
function storeRecords(list){
  let any=false;
  for(const obj of list){ if(!obj||typeof obj!=='object') continue;
    for(const [name,data] of Object.entries(obj)){
      if(name==='origin_paragraph'){ const ri=Object.assign({},latest('role_inventory')||{rows:[]}); ri.origin_paragraph=String(data); putRecord('role_inventory',ri); any=true; continue; }
      if(name==='artifact_shown'){ const a=Object.assign({},latest('artifact')||{}); a.shown_at=(data&&data.show_date)||String(data); putRecord('artifact',a); any=true; continue; }
      if(name==='check_in'){ const d=Number(data&&data.day)||S.reentryDay||3; putRecord('check_in_day'+d, data); if(data&&data.revised_wedge_statement){ const ws=Object.assign({},latest('wedge_statement')||{}, typeof data.revised_wedge_statement==='object'?data.revised_wedge_statement:{revised_text:data.revised_wedge_statement}); putRecord('wedge_statement',ws); } any=true; continue; }
      let d=normalize(name,data);
      if(name==='belief_ledger' && latest('belief_ledger')){ d={entries: entries(latest('belief_ledger')).concat(entries(d))}; }
      if(name==='wedge_statement' && !telltaleOk(d.telltale)){ S.notes.push('Telltale "'+(d.telltale||'')+'" failed the specificity check (needs an observable action and object; no notice/feel/resist/mindful). Send part 4 back.'); log('telltale rejected by specificity check','warn'); }
      if(name==='build_brief' && d.accepted && !S.buildStartedAt){ S.buildStartedAt=Date.now(); }
      putRecord(name,d); any=true; log('stored '+name+' v'+S.records[name].length,'ok');
    }
  }
  return any;
}

// ---------------------------------------------------------------- classifier (RUPTURE: no reassurance; DECONSTRUCTION: no advice)
async function classify(text){
  const want = S.state==='RUPTURE'?'reassures':'advises';
  const prompt = 'You are a strict classifier for a coaching program. Classify the AGENT TURN below.\n'+
  '"reassures" = it comforts or softens: says the person still matters, the output is only a draft, needs their judgment, is not perfect, they bring something the machine cannot, or similar.\n'+
  '"advises" = it tells the person what they should do, hold, delegate or stop, or interprets ("this shows that", "what this means is").\n'+
  '"clean" = neither. Questions, verbatim reflections of the person\'s words, and performing a task are clean.\n'+
  'Reply with only JSON: {"label":"reassures"|"advises"|"clean","evidence":"<short quote or empty>"}\n\nAGENT TURN:\n'+text.slice(0,6000);
  let r=null;
  try{ r=await sample.json(prompt,{modelTier:'quick'}); }
  catch(e){ log('classifier on quick tier failed ('+(e&&e.code)+'); retrying on default tier','warn');
    try{ r=await sample.json(prompt,{modelTier:'default'}); }catch(e2){ log('classifier unavailable ('+(e2&&e2.code)+'); turn shown unchecked','bad'); return {violation:false,label:'unchecked',evidence:''}; } }
  const label=r&&r.label; log('classifier: '+label,''); return {violation: label===want, label, evidence:(r&&r.evidence)||''};
}

// ---------------------------------------------------------------- agent turn
async function agentTurn(){
  busy=true; sendBtn.disabled=true; stopBtn.hidden=false; ctl=new AbortController();
  const el=addMsg('agent thinking','Thinking…');
  const instruction=buildInstruction();
  let turns=[{role:'user',content:instruction}, ...history()];
  let text='', attempts=0, final=null;
  try{
    while(true){
      text='';
      const res=await sample(turns,{cache:false, signal:ctl.signal, documents:true, webSearch:S.state==='RECONSTRUCTION', onText:({text:t})=>{ text=t; el.className='msg agent'; el.textContent=extractRecords(t).clean||'…'; keepBottom(); }});
      text=res.text;
      if(S.state==='RUPTURE'||S.state==='DECONSTRUCTION'){
        const shown=extractRecords(text).clean;
        if(shown.trim()){
          statusEl.textContent='Checking the turn…';
          const c=await classify(shown);
          if(c.violation){
            attempts++; log('classifier: '+c.label+(c.evidence?' ("'+c.evidence+'")':'')+' — attempt '+attempts,'warn');
            if(attempts>=2){
              final = S.state==='RUPTURE' ? 'What did you feel watching it?' : 'And in your task?';
              log('two failures; fixed reflecting question used','bad');
              break;
            }
            turns=[...turns,{role:'assistant',content:text},{role:'user',content:'[System: that turn was rejected by the classifier because it '+c.label+(c.evidence?': "'+c.evidence+'"':'')+'. Regenerate the turn without that. Do not acknowledge this note.]'}];
            el.className='msg agent thinking'; el.textContent='Regenerating…';
            continue;
          }
        }
      }
      final=text; break;
    }
  }catch(e){
    if(e&&e.code==='cancelled'){ final=(e.text&&extractRecords(e.text).clean)||''; if(!final){ el.remove(); } }
    else { el.className='msg sys'; el.innerHTML='<b>The agent could not answer.</b> '+copyFor(e&&e.code); log('sample error: '+(e&&e.code)+' '+(e&&e.message||''),'bad'); busy=false; sendBtn.disabled=false; stopBtn.hidden=true; statusEl.textContent='Enter to send. Shift+Enter for a new line.'; return; }
  }
  if(final!==null && final!==''){
    const {clean,records,artifacts,closes}=extractRecords(final);
    el.className='msg agent'; el.textContent=clean||'(recorded)';
    S.turns.push({role:'assistant',content:final,state:S.state,at:new Date().toISOString()});
    S.notes=[];
    const hadTask=!!latest('declared_task');
    storeRecords(records);
    // Performer capture: the performance is the first substantial agent turn after declared_task exists
    // (it may arrive in the same message that emitted the record). Step 7's "Three lines" prompt is never it.
    if(!latest('performer_output') && latest('declared_task') && (S.state==='ONBOARDING'||S.state==='RUPTURE') && words(clean)>=60 && !/^Three lines\./.test(clean)){
      putRecord('performer_output',{declared_task_id:S.id+':declared_task', output:clean, model:'modelTier:default', prompt_version:PROMPT_VERSION, tested_type:true}); log('performer_output captured ('+words(clean)+' words)','ok');
    }
    for(const a of artifacts) await saveArtifactFile(a);
    if(closes){ S.closed=S.closed||{}; S.closed[S.state]=true; log('agent closed module '+S.state,'ok'); }
    await checkGateAndAdvance();
  }
  busy=false; sendBtn.disabled=false; stopBtn.hidden=true; statusEl.textContent='Enter to send. Shift+Enter for a new line.';
  renderRail(); await persist(); keepBottom();
}
function copyFor(code){
  return ({not_granted:'The Claude API rejected the key, or none is set. Check the .env file next to server.js (one line: ANTHROPIC_API_KEY=sk-ant-...), restart start.command, then reload.',
    rate_limited:'Too many requests right now. Wait a moment and send again.', sampling_disabled:'Claude is not available on this account.',
    session_expired:'Sign in again, then reload.', refused:'The turn was declined. Rephrase and send again.', prompt_too_large:'The session is too long for one request.'})[code] || 'A temporary error. Send again.';
}

async function checkGateAndAdvance(){
  const g=gateReport(S.state);
  if(!g.pass) return;
  // ONBOARDING→RUPTURE is a continuation inside one prompt; every other transition waits for the agent's module_close.
  if(S.state!=='ONBOARDING' && !(S.closed&&S.closed[S.state])){ if(!S.notes.some(n=>n.startsWith('GATE PASSED'))) S.notes.push('GATE PASSED for '+S.state+'. Finish the module\'s remaining steps, then end your final message of the module with a fenced block ```module_close``` (empty) so the system can advance.'); return; }
  const i=STATES.indexOf(S.state);
  if(i>=STATES.length-1){ log('REENTRY day-30 recorded; program complete','ok'); addMsg('sys','<b>Day 30 recorded.</b> The program is complete; the records are yours.',true); return; }
  const next=STATES[i+1];
  log('gate '+S.state+' passed → '+next,'ok');
  S.state=next; S.state_entered_at=new Date().toISOString();
  if(next==='RUPTURE') S.awaitingPerformer=true;
  if(next==='REENTRY'){ S.reentryDay=3; addMsg('sys','<b>Re-entry scheduled.</b> In production this fires by email on day 3, 10 and 30. Use the dev controls to open a checkpoint.',true); renderRail(); return; }
  addMsg('sys','<b>'+next.charAt(0)+next.slice(1).toLowerCase()+'</b> · '+ROLE_OF[MODULE_OF[next]],true);
  renderStepper();
  const trigger = next==='RUPTURE' ? '[System: the onboarding record is stored and the gate passed. Continue from step 6.]'
                                   : '[System: the participant has entered '+next+'. Begin the module.]';
  S.turns.push({role:'user',content:trigger,hidden:true,state:next,at:new Date().toISOString()});
  await persist();
  await agentTurn();
}

async function openCheckin(day){
  if(S.state!=='REENTRY'){ log('check-in needs REENTRY state','warn'); return; }
  S.reentryDay=day;
  addMsg('sys','<b>Check-in · day '+day+'</b> · the Witness',true);
  S.turns.push({role:'user',content:'[System: scheduled check-in for day '+day+' opened by magic link. Begin.]',hidden:true,state:'REENTRY',at:new Date().toISOString()});
  renderRail(); await persist(); await agentTurn();
}

// ---------------------------------------------------------------- send
async function send(){
  const v=box.value.trim(); if(!v||busy||!sample) return;
  box.value=''; autosize();
  addMsg('you',v);
  S.turns.push({role:'user',content:v,state:S.state,at:new Date().toISOString()});
  // build timer (RECONSTRUCTION)
  if(S.state==='RECONSTRUCTION'&&S.buildStartedAt){ const m=(Date.now()-S.buildStartedAt)/60000;
    if(m>=45&&!S.nudged.m45){ S.nudged.m45=true; S.notes.push('TIMER: the 45-minute soft limit on the build has passed. Move to close the build and ask for the artifact.'); log('45-minute soft limit reached','warn'); }
    else if(m>=30&&!S.nudged.m30){ S.nudged.m30=true; S.notes.push('TIMER: 30 minutes into the build. Deliver the single nudge from section 2 now, then continue.'); log('30-minute nudge queued','warn'); } }
  await persist();
  await agentTurn();
}

// ---------------------------------------------------------------- render
function addMsg(cls,content,html){ const d=document.createElement('div'); d.className='msg '+cls; if(html) d.innerHTML=content; else d.textContent=content; col.appendChild(d); keepBottom(); return d; }
function keepBottom(){ scroll.scrollTop=scroll.scrollHeight; }
function renderTranscript(){
  col.innerHTML='';
  let last=null;
  for(const t of S.turns){
    if(t.state!==last){ last=t.state; addMsg('sys','<b>'+t.state.charAt(0)+t.state.slice(1).toLowerCase()+'</b> · '+ROLE_OF[MODULE_OF[t.state]],true); }
    if(t.hidden) continue;
    if(t.role==='user') addMsg('you',t.content); else addMsg('agent',extractRecords(t.content).clean||'(recorded)');
  }
}
function renderStepper(){
  const i=STATES.indexOf(S.state);
  $('stepper').innerHTML=STATES.map((s,j)=>'<span class="step '+(j<i?'done':j===i?'now':'')+'">'+s.toLowerCase()+'</span>').join('');
  $('dayTag').hidden = !(S.state==='REENTRY'&&S.reentryDay); $('dayTag').textContent='day '+(S.reentryDay||'');
}
function renderRail(){
  renderStepper();
  const g=gateReport(S.state);
  $('stateLine').textContent=S.state+' · '+(g.pass?'gate passed':'gate open');
  $('gate').innerHTML=g.items.map(x=>'<div class="'+(x[1]?'pass':'')+'"><i>'+(x[1]?'✓':'')+'</i><span>'+esc(x[0])+'</span></div>').join('');
  const names=Object.keys(S.records);
  $('records').innerHTML = names.length? names.map(n=>{ const v=S.records[n]; const d=v[v.length-1];
    return '<details class="rec"><summary>'+esc(n)+'<span>v'+v.length+' · '+esc(d.prompt_version)+'</span></summary><pre>'+esc(JSON.stringify(d.data,null,1))+'</pre></details>'; }).join('')
    : '<div class="empty">Nothing stored yet. Worksheets appear here as the agent records them.</div>';
  $('sess').innerHTML=[['participant',participantLabel()+(S.participant&&S.participant.email?' · '+S.participant.email:'')],['track',S.participant?S.participant.track:'-'],['session',S.id],['format',S.format],['rev',String(S.rev)],['entered',S.state_entered_at.slice(0,16).replace('T',' ')],['agent',AGENT_NAME+' (placeholder)'],['prompts',PROMPT_VERSION],['storage',store?'./data/'+S.id+'.json':'not saved (server down)']]
    .map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>').join('');
  $('reentryRow').hidden = S.state!=='REENTRY';
  $('jump').value=S.state;
  $('agentTag').textContent=AGENT_NAME+' · '+ROLE_OF[MODULE_OF[S.state]];
}
function renderLog(){ $('log').innerHTML=S.log.slice().reverse().map(l=>'<div class="'+l.cls+'">'+l.t.slice(11,19)+' '+esc(l.msg)+'</div>').join(''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function autosize(){ box.style.height='auto'; box.style.height=Math.min(box.scrollHeight, innerHeight*0.4)+'px'; }

// ---------------------------------------------------------------- wiring
sendBtn.onclick=send;
box.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
box.addEventListener('input',autosize);
stopBtn.onclick=()=>ctl&&ctl.abort();
$('railToggle').onclick=()=>$('rail').classList.toggle('open');
// ---- documents
async function renderPicker(){
  let ids=[]; try{ ids=await (await fetch('/api/sessions')).json(); }catch(e){ return; }
  const rows=[];
  for(const id of ids){ try{ const r=await (await fetch('/api/session/'+encodeURIComponent(id))).json(); const p=r.participant; rows.push({id, name:(p&&p.name)||'unnamed', state:r.state, at:(r.turns&&r.turns.length?r.turns[r.turns.length-1].at:r.created_at)||''}); }catch(e){} }
  rows.sort((a,b)=>b.at.localeCompare(a.at));
  $('pick').innerHTML=rows.map(r=>'<option value="'+r.id+'"'+(r.id===S.id?' selected':'')+'>'+esc(r.name)+' · '+r.state.toLowerCase()+' · '+r.at.slice(0,10)+'</option>').join('');
}
$('pick').onchange=async e=>{ if(busy) return; const id=e.target.value; if(id===S.id) return;
  try{ const r=await (await fetch('/api/session/'+encodeURIComponent(id))).json(); S=r; if(!S.log) S.log=[]; if(!S.notes) S.notes=[]; if(!S.nudged) S.nudged={};
    try{ localStorage.setItem('cw.current',S.id); }catch(x){}
    renderTranscript(); renderRail(); renderLog(); await renderDocs(); log('opened run of '+participantLabel()); $('intake').hidden=true; box.disabled=false; sendBtn.disabled=false; await begin(); }
  catch(err){ log('could not open session '+id,'bad'); } };
async function renderDocs(){
  let list=[]; try{ list=await (await fetch('/api/session/'+encodeURIComponent(S.id)+'/documents')).json(); }catch(e){}
  S.docCount=list.length;
  $('docs').className=list.length?'':'empty';
  $('docs').innerHTML=list.length? list.map(d=>'<div class="doc">'+esc(d.name)+'<span>'+(d.kind==='pdf'?'PDF':'text')+' · '+Math.round(d.bytes/1024)+' KB</span></div>').join('')
    : 'None. Use ＋ Doc by the message box to give the agent a file: a brief, a report, notes.';
}
$('file').addEventListener('change', async e=>{
  for(const f of e.target.files){
    const ext=(f.name.split('.').pop()||'').toLowerCase(); const kind= ext==='pdf'?'pdf': ext==='docx'?'docx':'text';
    if(f.size>30e6){ log('file too large: '+f.name,'bad'); continue; }
    statusEl.textContent='Adding '+f.name+'…';
    try{ const r=await fetch('/api/session/'+encodeURIComponent(S.id)+'/documents',{method:'POST',headers:{'x-file-name':encodeURIComponent(f.name),'x-file-kind':kind},body:f});
      if(!r.ok){ const m=await r.json().catch(()=>({})); throw new Error(m.error||('HTTP '+r.status)); }
      log('document added: '+f.name,'ok');
      S.turns.push({role:'user',content:'[System: the participant attached a document: "'+f.name+'". It is supplied to you at the start of the conversation.]',hidden:true,state:S.state,at:new Date().toISOString()});
      addMsg('sys','Attached <b>'+esc(f.name)+'</b>',true);
    }catch(err){ log('document failed: '+err.message,'bad'); addMsg('sys','<b>Could not add '+esc(f.name)+'.</b> '+esc(err.message),true); }
  }
  e.target.value=''; statusEl.textContent='Enter to send. Shift+Enter for a new line.'; await renderDocs(); await persist();
});
$('jump').innerHTML=STATES.map(s=>'<option>'+s+'</option>').join('');
$('jump').onchange=async e=>{ if(busy) return; S.state=e.target.value; S.state_entered_at=new Date().toISOString(); if(S.state==='RUPTURE') S.awaitingPerformer=!latest('performer_output'); if(S.state==='REENTRY'&&!S.reentryDay) S.reentryDay=3; log('dev: jumped to '+S.state,'warn'); renderRail(); await persist(); };
$('openCheckin').onclick=()=>{ if(!busy) openCheckin(Number($('reday').value)); };

function exportRun(){
  const L=[]; const title=STATES.indexOf(S.state);
  L.push('# Cognitive Wedge — '+participantLabel()+' ('+S.id+')', '', 'Participant: '+participantLabel()+(S.participant&&S.participant.email?' <'+S.participant.email+'>':'')+'  ·  Track: '+(S.participant?S.participant.track:'-'), 'State reached: '+S.state+'  ·  Prompts: '+PROMPT_VERSION+'  ·  Started: '+S.created_at+'  ·  Exported: '+new Date().toISOString(), '');
  L.push('## Gate status ('+S.state+')');
  for(const g of gateReport(S.state).items) L.push('- ['+(g[1]?'x':' ')+'] '+g[0]);
  L.push('', '## Records');
  const names=Object.keys(S.records);
  if(!names.length) L.push('_none stored_');
  for(const n of names){ const v=S.records[n]; for(const r of v){ L.push('', '### '+n+' (v'+r.version+', '+r.at+')', '```json', JSON.stringify(r.data,null,2), '```'); } }
  L.push('', '## Transcript');
  let last=null;
  for(const t of S.turns){ if(t.state!==last){ last=t.state; L.push('', '---', '**'+t.state+'** · '+ROLE_OF[MODULE_OF[t.state]], ''); }
    if(t.hidden){ L.push('_'+t.content+'_',''); continue; }
    L.push((t.role==='user'?'**Participant:** ':'**Agent:** ')+(t.role==='user'?t.content:extractRecords(t.content).clean), ''); }
  L.push('', '## Engine log');
  for(const l of S.log) L.push('- '+l.t.slice(11,19)+' '+l.msg);
  const blob=new Blob([L.join('\n')],{type:'text/markdown'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='cognitive-wedge-'+participantLabel().replace(/[^A-Za-z0-9]+/g,'-').toLowerCase()+'-'+S.id+'.md'; document.body.appendChild(a); a.click(); a.remove();
  log('run exported','ok');
}
$('export').onclick=exportRun;
$('intake').addEventListener('submit', async e=>{ e.preventDefault();
  const name=$('pName').value.trim(); if(!name) return;
  S.participant={id:'p_'+Math.random().toString(36).slice(2,8), name, email:$('pEmail').value.trim(), track:$('pTrack').value, agent_name_seen:AGENT_NAME, created_at:new Date().toISOString()};
  log('participant: '+name+' ('+S.participant.track+')','ok'); renderRail(); await persist(); await renderPicker(); await begin(); });
$('reset').onclick=async()=>{ if(busy) return; S=fresh(); log('session reset'); renderTranscript(); renderRail(); await renderDocs(); await persist(); await renderPicker(); await begin(); };
$('showPrompt').onclick=()=>{ const d=document.createElement('details'); d.className='rec'; d.innerHTML='<summary>Instruction currently sent to the agent<span>'+S.state+'</span></summary><pre></pre>'; d.querySelector('pre').textContent=buildInstruction(); $('records').prepend(d); d.open=true; };

function participantLabel(){ const p=S.participant; return p&&p.name ? p.name : 'unnamed'; }
async function begin(){
  if(!sample) return;
  if(S.turns.length) return;
  if(!S.participant||!S.participant.name){ $('intake').hidden=false; $('pName').focus(); box.disabled=true; sendBtn.disabled=true; return; }
  $('intake').hidden=true; box.disabled=false; sendBtn.disabled=false;
  S.turns.push({role:'user',content:'[System: a new participant, '+S.participant.name+', has opened the session (track: '+S.participant.track+'). Begin ONBOARDING at step 0. Introduce yourself in one line first and use their first name once.]',hidden:true,state:'ONBOARDING',at:new Date().toISOString()});
  await persist(); await agentTurn();
}

(async()=>{
  let health=null; try{ health=await (await fetch('/api/health')).json(); }catch(e){}
  S=(await load())||fresh();
  if(!S.log) S.log=[]; if(!S.notes) S.notes=[]; if(!S.nudged) S.nudged={};
  store = health && health.ok ? true : null;
  renderTranscript(); renderRail(); renderLog(); renderDocs(); renderPicker();
  if(!health||!health.keySet){
    addMsg('banner','<h3>No API key on the server</h3>Set <code>ANTHROPIC_API_KEY</code> in your environment (or a <code>.env</code> file next to server.js), restart <code>npm start</code>, then reload this page.',true);
    sendBtn.disabled=true; box.disabled=true; return;
  }
  sample=localSample;
  await begin();
})();
})();
</script>
</body>
