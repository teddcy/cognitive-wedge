<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cognitive Wedge</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="wrap narrow">
  <h1>Cognitive Wedge</h1>
  <p class="lede">A one-sitting session that decides what you do and what you hand to an AI agent. About 65 minutes. Enter your email and we will send you a link to start, and to pick up where you left off.</p>
  <form id="f" class="card">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="email" placeholder="you@company.com">
    <label for="track">I am using this for</label>
    <select id="track"><option value="commercial">My work</option><option value="personal">Personal projects</option></select>
    <button type="submit" id="go">Send me the link</button>
    <p id="msg" class="note" role="status"></p>
  </form>
</main>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
f.addEventListener('submit', async (e) => {
  e.preventDefault(); go.disabled = true; msg.textContent = '';
  try {
    const r = await fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email.value, track: track.value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error === 'slow_down' ? 'Too many tries. Please wait a while.' : 'Please check the email address.');
    msg.innerHTML = 'Check your email for the link.' + (j.devLink ? ` <br>Dev mode: <a href="${j.devLink}">open the link</a>.` : '');
  } catch (err) { msg.textContent = err.message; go.disabled = false; }
});
</script>
</body>
</html>
