<title>Cognitive Wedge Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: an operator's console. A quiet header with the track filter, one row of summary figures per view, then hairline-ruled panels. Data carries all the colour. */
:root{
  --font:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --page:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --hover:rgba(11,11,11,.04);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --dim:#9ec5f4;
  --good-text:#006300; --serious:#ec835a;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0d0d0d; --surface:#1a1a19;
    --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --dim:#1c5cab;
    --good-text:#0ca30c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19;
  --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --dim:#1c5cab;
  --good-text:#0ca30c; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
h1{font-size:24px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--axis);border-radius:999px;padding:3px 10px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink2);white-space:nowrap}
.ctl{display:inline-flex;border:1px solid var(--axis);border-radius:8px;overflow:hidden;background:var(--surface)}
.ctl button{appearance:none;background:none;border:0;padding:6px 12px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:600}
.ctl button+button{border-left:1px solid var(--axis)}
.ctl button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.note{margin:12px 0 0;color:var(--ink2);font-size:13.5px;max-width:78ch}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--grid);overflow-x:auto;margin:16px 0 18px}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--s1)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 20px;margin-bottom:18px}
.kpi{border-top:1px solid var(--axis);padding-top:10px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--ink2)}
.kpi .n{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.01em;margin:2px 0}
.kpi .s{font-size:13px;color:var(--ink2)}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:900px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px 14px;min-width:0}
.ph{margin-bottom:14px}
.panel h2{font-size:16px;margin:0;font-weight:700}
.sub{margin:3px 0 0;color:var(--ink2);font-size:13.5px;text-wrap:pretty}
.sub b{color:var(--ink)}
.src{margin:12px 0 0;font-size:12px;color:var(--muted);font-family:var(--mono)}

.brow{display:grid;grid-template-columns:minmax(92px,32%) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.trk{position:relative;border-left:1px solid var(--axis);height:20px;display:flex;align-items:center}
.bar{height:18px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bar.dim{background:var(--dim)}
.v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.h{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding-bottom:2px;border-bottom:1px solid var(--grid);margin-bottom:2px}
.p,.ls,.o{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}

.frow{display:grid;grid-template-columns:minmax(104px,31%) minmax(0,1fr) 34px 44px 44px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.frow .l{line-height:1.2}
.flag{display:block;font-size:11.5px;color:var(--ink2);margin-top:1px}
.flag::before{content:"▲ ";color:var(--serious)}
.trow{display:grid;grid-template-columns:minmax(96px,24%) minmax(0,1fr) 54px 84px 56px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.tick{position:absolute;top:-3px;width:2px;height:26px;background:var(--ink);border-radius:1px}
.up{color:var(--ink2)} .up i,.ok i{font-style:normal}
.up i{color:var(--serious)} .ok i{color:var(--good-text)}
.trow.dr{grid-template-columns:104px minmax(0,1fr) 44px minmax(0,1.3fr)}
.trow.dr .o{white-space:normal;font-size:12.5px}
@media (max-width:560px){
  .frow{grid-template-columns:minmax(90px,34%) minmax(0,1fr) 30px 40px}.frow .ls{display:none}
  .trow{grid-template-columns:minmax(80px,28%) minmax(0,1fr) 50px 70px}.trow .fs{display:none}
}

.srow{display:grid;grid-template-columns:minmax(92px,22%) minmax(0,1fr);gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.stack{display:flex;gap:2px;height:24px;min-width:0}
.seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;min-width:0;white-space:nowrap;border-radius:2px 0 0 2px}
.seg:first-child{border-radius:0}
.seg:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:8px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.lg2{grid-column:2;margin:-2px 0 8px;font-size:12.5px;color:var(--ink2)}

.tv{margin-top:10px;font-size:13px}
.tv summary{cursor:pointer;color:var(--ink2);font-weight:600;width:max-content}
.tw{overflow-x:auto}
.dt{border-collapse:collapse;width:100%;font-size:13.5px}
.dt th,.dt td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap;font-weight:400}
.dt thead th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.dt tbody th{font-weight:600}
.dt td.num{font-variant-numeric:tabular-nums}
tr.pr{cursor:pointer}
tr.pr:hover{background:var(--hover)}
.mono{font-family:var(--mono);font-size:13px}
.strip{display:inline-flex;gap:2px;vertical-align:middle}
.strip i{width:10px;height:14px;border-radius:2px;background:var(--grid)}
.strip i.on{background:var(--s1)}
.stt i{font-style:normal;margin-right:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--axis);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}

.hist{position:relative;padding-top:24px}
.hbands{position:absolute;top:0;left:0;right:0;height:20px;font-size:12px;color:var(--ink2);font-weight:600}
.hbands span{position:absolute;top:0;white-space:nowrap}
.hbands i{font-style:normal}
.hcols{display:flex;align-items:flex-end;height:130px;border-bottom:1px solid var(--axis)}
.hc{flex:1 1 0;height:100%;display:flex;align-items:flex-end;min-width:0;padding:0 1.5px}
.hb{width:100%;border-radius:3px 3px 0 0;min-height:2px}
.hcut{position:absolute;top:22px;height:130px;width:0;border-left:1px dashed var(--axis)}
.hax{position:relative;height:20px;font-size:12px;color:var(--muted)}
.hax span{position:absolute;top:4px;transform:translateX(-50%)}
.band{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;white-space:nowrap}
.band i{font-style:normal}
.pm{display:inline-block;margin-right:8px;font-size:13px;white-space:nowrap}
.pm b{font-weight:600;color:var(--ink2);font-size:11.5px;margin-right:2px}
.big{font-size:44px;line-height:1;font-weight:700;letter-spacing:-.02em}
.sbox{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;margin:10px 0 8px}
.crow{display:grid;grid-template-columns:minmax(110px,34%) minmax(0,1fr) 52px;gap:10px;align-items:center;padding:4px 0;font-size:13.5px}
ul.miss{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12.5px;max-width:260px;line-height:1.35}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:40;overflow-y:auto;
  padding:22px 20px 40px;padding-top:max(22px,calc(env(safe-area-inset-top,0px) + 14px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
.drawer h2{font-size:20px;margin:0}
.drawer h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:22px 0 8px;font-weight:600;border-bottom:1px solid var(--grid);padding-bottom:4px}
.x{position:absolute;top:12px;right:14px;appearance:none;border:1px solid var(--axis);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13.5px;font-weight:600}
.rec{margin:0;display:grid;gap:12px}
.rec dt{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:2px}
.rec dd{margin:0;font-size:14.5px}
.vch{display:flex;flex-wrap:wrap;gap:6px}
.vch span{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--grid);border-radius:6px;padding:3px 8px}
.cap{font-size:12px;color:var(--muted);margin:4px 0 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;color:var(--ink2);font-size:13.5px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.tab,.ctl button{transition:color .12s,background .12s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M3 24 L27 6 L27 24 Z" fill="var(--s1)"/><path d="M3 24 H27" stroke="var(--ink)" stroke-width="1.5"/></svg>
      <div><h1>Cognitive Wedge</h1><p>Program dashboard</p></div>
    </div>
    <div class="tools">
      <span class="chip" id="chip">Sample data</span>
      <div class="ctl" role="group" aria-label="Track filter" id="trackctl">
        <button type="button" data-track="all" aria-pressed="true">All tracks</button>
        <button type="button" data-track="commercial" aria-pressed="false">Commercial</button>
        <button type="button" data-track="personal" aria-pressed="false">Personal</button>
      </div>
    </div>
  </header>
  <p class="note" id="notice">48 invented participants. Every number, quote and name here is made up to show the layout; nothing is real participant data. Views follow the Dashboard section of the spec.</p>
  <nav class="tabs" role="tablist" aria-label="Dashboard views" id="tabs"></nav>
  <main id="view"></main>
</div>
<div class="tip" id="tip" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Participant page" hidden></aside>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var pct=function(n,d,dp){return d?(100*n/d).toFixed(dp||0)+'%':'–'};
var med=function(a){if(!a.length)return null;var s=a.slice().sort(function(x,y){return x-y}),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
var mean=function(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0};
var sum=function(a){return a.reduce(function(x,y){return x+y},0)};

/* ---------- constants from the spec ---------- */
var STAGES=['Started Orientation','Entered Onboarding','Entered Rupture','Entered Deconstruction','Entered Reconstruction','Finished Reconstruction','Day 3 check-in','Day 10 check-in','Day 30 check-in'];
var STATES=[{n:'Orientation',b:2},{n:'Onboarding',b:7},{n:'Rupture',b:8},{n:'Deconstruction',b:13},{n:'Reconstruction',b:35}];
var GATES=['Orientation: objective restated','Onboarding: task in library','Rupture: gap named','Deconstruction: layers and ledger','Reconstruction: tell-tale and reader'];
var LAYERS=['Intent','Context','Judgment','Relationship','Execution'];
var VERD=['touched','faked','never reached'];
var TAGS=['still_true','inherited','defensive'];
var SRCL={boss:'Boss',credential:'Credential',first_job:'First job',fear:'Fear',other:'Other'};

/* ---------- seeded sample data ---------- */
function rng(a){return function(){var t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
var R=rng(20261028);
var ipick=function(a){return Math.floor(R()*a.length)};
var wpick=function(o){var x=R(),acc=0,ks=Object.keys(o);for(var i=0;i<ks.length;i++){acc+=o[ks[i]];if(x<acc)return ks[i]}return ks[ks.length-1]};

var PROB=[.94,.93,.94,.85,.86,.92,.90,.85];
var MULT=[function(){return .7+.7*R()},function(){return .75+.7*R()},function(){return .6+.8*R()},function(){return .8+.9*R()},function(){return .75+.7*R()}];
var FAST=[null,1.2,null,1.3,1.2];
var GM=[.3,.7,.2,.5,1.6];
var CP={rupture:{reassures:.055},decon:{advises:.03,steers:.035,reassures:.01}};
var VP=[{touched:.55,faked:.30,'never reached':.15},{touched:.15,faked:.35,'never reached':.50},{touched:.25,faked:.40,'never reached':.35},{touched:.10,faked:.20,'never reached':.70},{touched:.85,faked:.10,'never reached':.05}];
var EP={touched:.9,faked:.75,'never reached':.4};
var AT={Judgment:.35,Relationship:.25,Context:.2,Intent:.1,Execution:.1};
var REJ=['Negotiation prep','Org design review','Board deck','Hiring decision','Legal review summary','Customer escalation reply','Investment memo'];
var TASKS={'Client proposal':'Write the renewal proposal for our largest logistics client','Quarterly narrative':'Write the Q3 narrative for the leadership update','Stakeholder update':'Draft the Friday update for the steering group','Roadmap memo':'Write the memo deciding which clients get the Q1 roadmap slot','Performance review':'Write the mid-year review for a direct report','Budget justification':'Write the case for next year’s analytics budget'};
var TYPES=Object.keys(TASKS);
var RIGHT=['The structure was right.','It found the right opening line.','The numbers section was clean.'];
var WRONG=['It did not know the history with the client.','It missed the politics around the date.','The ask was too safe.','It had no idea who objects to this.'];
var FELT=['Faster than me, and that annoyed me.','Calm at first, then a little hollow.','Like watching someone wear my coat.','Relieved, then suspicious of the relief.','Nothing for a minute, then irritated.'];
var GAP=['That the writing was the hard part.','That nobody else could get the tone right.','That my drafts are better because they take longer.','That I needed the full history before I could start.'];
var BEL=[['Good managers write their own reviews','boss'],['Judgment only comes from doing it by hand','first_job'],['If I hand off the draft I lose the thread','fear'],['Senior people do not use templates','credential'],['Clients can tell when it is not me','fear'],['The first version is where the thinking happens','first_job'],['You earn the right to delegate by doing it for years','boss'],['A real analyst builds the model themselves','credential'],['Speed means cutting corners','boss'],['It is my job to know the numbers cold','other']];
var TELL=['I opened a blank document and started typing','I rewrote the agent’s first paragraph before reading the second','I reopened last quarter’s deck and copied slide 3','I asked a colleague to recheck numbers the agent had already sourced','I started a spreadsheet from scratch'];
var BUILD=['A 40-client renewal forecast with three scenarios each','A pricing scan across 60 competitor products','Synthesis of 85 customer interview transcripts','A variance analysis across 12 cost centres'];
var SEEN=['Marta Silva, COO','Ken Ito, client lead','Jo Barnes, CFO','Amara Obi, head of product'];
var NEXT=['A churn-risk summary for every account','A monthly board pack drafted end to end','A hiring scorecard for the next three roles'];
var UNC=['That my drafts are mine','That I am the only one who checks the numbers','That I decide what the client hears first'];
var COMMIT=['Hand off the first draft of weekly status reports','Hand off first-pass client research','Hand off meeting summaries and follow-ups'];

function classify(mod){var x=R(),acc=0,o=CP[mod],ks=Object.keys(o);for(var i=0;i<ks.length;i++){acc+=o[ks[i]];if(x<acc)return ks[i]}return 'clean'}
function runTurns(mod,turns){var o={turns:turns,reg:{},fb:0};for(var i=0;i<turns;i++){var c=classify(mod);if(c==='clean')continue;o.reg[c]=(o.reg[c]||0)+1;if(R()<.35)o.fb++}return o}

var COMPS=[{k:'wedge',n:'Wedge concreteness',max:30},{k:'build',n:'Build follow-through',max:20},{k:'recog',n:'Self-recognition',max:20},{k:'pace',n:'Pace and friction',max:15},{k:'rupt',n:'Rupture landed',max:15}];
var ORDER=['strong','watch','risk'];
var LAB={strong:'Strong',watch:'Watch',risk:'At risk'};
var SYM={full:'●',part:'◐',thin:'○',none:'–'},LV={full:'strong',part:'partial',thin:'thin',none:'not reached yet'};
function score(p){
  if(p.r<5)return null;
  var S=[],add=function(c,key,max,pts,miss){S.push({c:c,key:key,max:max,pts:pts,miss:pts<max?miss:''})};
  var full=p.r>=6;
  if(full){
    var tt=p.g[4];
    add('wedge','tell',12,tt===0?12:(tt<=2?7:2),'Tell-tale needed '+tt+(tt===1?' rejection':' rejections'));
    add('wedge','map',10,p.map?10:0,'Day-3 commitment not tied to a delegated row');
    add('wedge','thesis',8,p.model.exec&&!p.model.judg?8:0,p.model.judg?'Model delegates a judgment or intent layer':'No execution layer delegated');
    add('build','show',10,p.show<=7?10:(p.show<=14?5:0),'Show date '+p.show+' days out');
    add('build','limit',6,p.buildMin<=20?6:0,'Build ran past the 20-minute limit');
    add('build','repro',4,p.build.first?4:0,'Build was sent back as too small');
  }
  var pointed=p.verd.filter(function(v){return v.pointed}).length;
  add('recog','line',6,pointed>=3?6:0,'Few verdicts backed by a line');
  add('recog','unw',4,p.unw?4:0,'No unwritten knowledge named');
  add('recog','tag',6,p.ledger.some(function(e){return e.tag!=='still_true'})?6:0,'No assumption tagged inherited or defensive');
  add('recog','rb',4,p.rb?4:0,'Read-back not completed');
  if(full){
    var tb=p.t[0].min+p.t[1].min+p.t[2].min+p.t[3].min;
    add('pace','time',6,tb<=40?6:0,'Took '+Math.round(tb)+' minutes to reach the build');
    add('pace','fast',4,p.fastN<=1?4:0,'Fast mode in '+p.fastN+' states');
    add('pace','retry',3,sum(p.g.slice(0,4))<=3?3:0,'Many gate retries before Reconstruction');
    add('pace','idle',2,p.idleGap?0:2,'Went idle during the session');
  }
  add('rupt','felt',5,p.rx.reprompt?0:5,'Feeling line needed a re-prompt');
  add('rupt','gap',4,p.rx.gapWords>=8?4:0,'Gap statement under 8 words');
  add('rupt','dwell',4,p.t[2].min>=4?4:0,'Skimmed Rupture');
  add('rupt','att',2,2,'');
  var comps={};COMPS.forEach(function(c){comps[c.k]={pts:0,max:0}});
  S.forEach(function(x){comps[x.c].pts+=x.pts;comps[x.c].max+=x.max});
  return {sig:S,comps:comps,total:full?sum(S.map(function(x){return x.pts})):null};
}
function band(t){return t>=75?'strong':(t>=55?'watch':'risk')}
function outlook(p){
  if(!p.sc||p.sc.total==null)return null;
  var b0=ORDER.indexOf(band(p.sc.total)),i=b0,why=[];

function genSample(){var P=[];

  p.cls={rupture:runTurns('rupture',r>=4?7:(r>=3?Math.round(7*R()):0)),decon:runTurns('decon',r>=5?22:(r>=4?Math.round(22*R()):0))};
  p.tx={right:ipick(RIGHT),wrong:ipick(WRONG),felt:ipick(FELT),gap:ipick(GAP),bel:ipick(BEL),year:2004+Math.floor(R()*16),tell:ipick(TELL),build:ipick(BUILD),seen:ipick(SEEN),next:ipick(NEXT),unc:ipick(UNC),commit:ipick(COMMIT)};

function vReadiness(rows){

  '</div>';
  var lo=40,wid=5,nb=12,bins=[];for(var i=0;i<nb;i++)bins.push(0);

  var mxb=Math.max.apply(null,bins)||1;

  var cavg=COMPS.map(function(c){return {n:c.n,v:100*mean(sc.map(function(p){return p.sc.comps[c.k].pts/c.max}))}}).sort(function(a,b){return a.v-b.v});
  var wk=cavg.map(function(x,k){return brow(x.n,x.v,100,x.v.toFixed(0)+'%',x.n+': '+x.v.toFixed(0)+'% of points earned on average',k>0)}).join('');
  var cal=ORDER.map(function(b){var g=G[b];return srow(LAB[b]+' · '+g.n,stack([{n:g.h,c:TIERC.held,tip:LAB[b]+' · held: '+g.h+' of '+g.n},{n:g.p,c:TIERC.partial,tip:LAB[b]+' · partial: '+g.p+' of '+g.n},{n:g.l,c:TIERC.lapsed,tip:LAB[b]+' · lapsed: '+g.l+' of '+g.n}],LAB[b]+' day-30 outcomes'))}).join('');
  var cleg=legend([{c:TIERC.held,t:'Held'},{c:TIERC.partial,t:'Partial'},{c:TIERC.lapsed,t:'Lapsed'}]);
  var gH=d30.filter(function(p){return tier(p)==='held'}),gL=d30.filter(function(p){return tier(p)==='lapsed'});
  var ap=function(g,k){return g.length?100*mean(g.map(function(p){return p.sc.comps[k].pts/p.sc.comps[k].max})):null};
  var sep=COMPS.map(function(c){var a=ap(gH,c.k),b=ap(gL,c.k);return {n:c.n,a:a,b:b,g:(a==null||b==null)?null:a-b}});
  var gm=Math.max.apply(null,sep.map(function(x){return x.g==null?-999:x.g}));
  var st='<div class="tw"><table class="dt"><thead><tr><th>Component</th><th>Held ('+gH.length+')</th><th>Lapsed ('+gL.length+')</th><th>Gap</th></tr></thead><tbody>'+sep.map(function(x){return '<tr><th scope="row">'+x.n+'</th><td class="num">'+(x.a==null?'–':x.a.toFixed(0)+'%')+'</td><td class="num">'+(x.b==null?'–':x.b.toFixed(0)+'%')+'</td><td class="num"'+(x.g!=null&&x.g===gm?' style="font-weight:700"':'')+'>'+(x.g==null?'–':(x.g>0?'+':'')+x.g.toFixed(0)+' pp')+'</td></tr>'}).join('')+'</tbody></table></div>';
  var rl=sc.filter(function(p){return p.r<9&&outlook(p).band!=='strong'}).sort(function(a,b){return a.sc.total-b.sc.total}).slice(0,8);

  var seg=['commercial','personal'].map(function(t){var g=P.filter(function(p){return p.track===t}),s2=g.filter(function(p){return p.sc&&p.sc.total!=null}),d=s2.filter(function(p){return p.d30});return '<tr><th scope="row">'+t+'</th><td class="num">'+g.length+'</td><td class="num">'+pct(s2.length,g.length)+'</td><td class="num">'+(s2.length?med(s2.map(function(p){return p.sc.total})).toFixed(0):'–')+'</td><td class="num">'+pct(s2.filter(function(p){return band(p.sc.total)==='strong'}).length,s2.length)+'</td><td class="num">'+(d.length?pct(d.filter(function(p){return tier(p)==='held'}).length,d.length)+' ('+d.length+')':'–')+'</td></tr>'}).join('');

    panel('Where the cohort loses points','Average share of each component’s points earned. The weakest is highlighted.',wk,'ReadinessScore','c5')+

    panel('What separates held from lapsed','Average share of points earned, by day-30 outcome. The widest gap is in bold.',st,'ReadinessScore, CheckIn','c5')+
    panel('Review list','Participants still in re-entry whose outlook is Watch or At risk, lowest score first.',rt,'ReadinessScore','c12')+

}

  var cs=COMPS.map(function(c){var v=p.sc.comps[c.k];if(!v.max)return '<div class="crow"><div>'+c.n+'</div><div class="trk"></div><div class="v">–</div></div>';return '<div class="crow"><div>'+c.n+'</div><div class="trk"><div class="bar" style="width:'+100*v.pts/c.max+'%"></div></div><div class="v">'+v.pts+'/'+c.max+'</div></div>'}).join('');

  if(p.d3)rec+=dl('Day 3 check-in',(p.d3.did?'Delegation happened.':'Delegation did not happen.')+' Tell-tale '+(p.d3.obs?'seen':'not seen')+'.');
  if(p.d10)rec+=dl('Day 10 check-in','Tell-tale '+(p.d10.obs?'seen'+(p.d10.acted?' and acted on':''):'not seen'+(p.d10.changed?'; the slip took a different shape, so the tell-tale was updated':''))+'.');
  if(p.d30)rec+=dl('Day 30 check-in','Second build '+(p.d30.shipped?'shipped':'not shipped')+'. Operating model '+p.d30.model+'. Statement '+p.d30.stmt+'.');
  var repv=p.r>=9?4:(p.r>=8?3:(p.r>=7?2:(p.r>=6?1:0)));
  var exit=p.exit?'Exit reason: '+p.exit+'.':'';
  return '<button class="x" type="button" id="xclose">Close</button><h2 class="mono">'+p.id+'</h2><div class="meta"><span>'+p.track+'</span><span>·</span><span>started week '+p.week+'</span><span>·</span><span style="color:var(--ink)"><i style="font-style:normal;color:'+st.c+'">'+st.ic+'</i> '+esc(st.t)+'</span></div>'+
    '<h3>Re-entry readiness</h3>'+readinessHtml(p)+'<h3>Session timing</h3><div class="trow dr h"><div>State</div><div>Minutes (| = budget)</div><div class="v">Min</div><div>Notes</div></div>'+tr+(exit?'<p class="cap">'+exit+'</p>':'')+
    '<h3>Records</h3>'+(rec?'<dl class="rec">'+rec+'</dl>'+(SAMPLE?'<p class="cap">All quotes are invented sample text.</p>':'<p class="cap">This view was logged.</p>')+'':'<p class="sub">No worksheet records yet.</p>')+
    '<h3>One-page report</h3>'+(detail&&detail.reports.length?'<p class="sub">'+detail.reports.map(function(v){return '<a href="/staff/report/'+p.sid+'/'+v.version+'" target="_blank" rel="noopener">v'+v.version+' ('+esc(v.checkpoint.replace('_',' '))+')</a>'}).join(' · ')+'</p>':'<p class="sub">'+(repv?'Version '+repv+' generated. Regenerated after each check-in; earlier versions are kept.':'Not generated. A report is created when Reconstruction ends.')+'</p>');
}
var lastFocus=null;
function openDrawer(id){
  var p=P.filter(function(x){return x.id===id})[0];if(!p)return;
  lastFocus=document.activeElement;
  var show=function(detail){$('#drawer').innerHTML=drawerHtml(p,detail);$('#drawer').hidden=false;$('#scrim').hidden=false;$('#xclose').focus()};
  if(p.live){fetch('/api/staff/participant/'+p.sid,{credentials:'same-origin'}).then(function(r){return r.json()}).then(show).catch(function(){show(null)})}else show(null);
}
function closeDrawer(){$('#drawer').hidden=true;$('#scrim').hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}

/* ---------- shell ---------- */
var VIEWS=[['funnel','Funnel and time',vFunnel],['friction','Gate friction',vFriction],['results','Results',vResults],['reentry','Re-entry',vReentry],['readiness','Readiness',vReadiness],['participants','Participants',vParticipants]];
var track='all';
function cur(){var h=(location.hash||'').replace('#','');return VIEWS.some(function(v){return v[0]===h})?h:'funnel'}
function render(){
  var c=cur();
  $('#tabs').innerHTML=VIEWS.map(function(v){return '<button class="tab" role="tab" type="button" data-v="'+v[0]+'" aria-selected="'+(v[0]===c)+'">'+v[1]+'</button>'}).join('');
  var rows=P.filter(function(p){return track==='all'||p.track===track});
  if(!rows.length){$('#view').innerHTML='<div class="grid">'+panel('No participants yet','Participants appear here once someone starts a session.','','','c12')+'</div>';return}
  $('#view').innerHTML=VIEWS.filter(function(v){return v[0]===c})[0][2](rows);
  var st=$('#st');if(st)st.value=ui.status;
}
document.addEventListener('click',function(e){
  var t=e.target.closest('.tab');if(t){location.hash=t.getAttribute('data-v');return}
  var b=e.target.closest('#trackctl button');if(b){track=b.getAttribute('data-track');document.querySelectorAll('#trackctl button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});render();return}
  var r=e.target.closest('tr.pr');if(r){openDrawer(r.getAttribute('data-id'));return}
  if(e.target.id==='scrim'||e.target.id==='xclose')closeDrawer();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#drawer').hidden)closeDrawer();
  if(e.key==='Enter'){var r=e.target.closest&&e.target.closest('tr.pr');if(r)openDrawer(r.getAttribute('data-id'))}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){ui.q=e.target.value;$('#ptb').innerHTML=ptRows(P.filter(function(p){return track==='all'||p.track===track}))}
});
document.addEventListener('change',function(e){
  if(e.target.id==='st'){ui.status=e.target.value;$('#ptb').innerHTML=ptRows(P.filter(function(p){return track==='all'||p.track===track}))}
});
var tip=$('#tip');
document.addEventListener('mouseover',function(e){var t=e.target.closest('[data-tip]');if(t){tip.textContent=t.getAttribute('data-tip');tip.hidden=false}});
document.addEventListener('mousemove',function(e){if(tip.hidden)return;var x=e.clientX+14,y=e.clientY+14,w=tip.offsetWidth,h=tip.offsetHeight;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'});
document.addEventListener('mouseout',function(e){if(e.target.closest&&e.target.closest('[data-tip]'))tip.hidden=true});
window.addEventListener('hashchange',render);
function banner(){
  $('#chip').textContent=LIVE?'Live data':'Sample data';
  $('#notice').textContent=LIVE?(P.length+' participants. Aggregate views carry no free text. Opening a participant page shows their own words, and each open is logged.'):'48 invented participants. Every number, quote and name here is made up to show the layout; nothing is real participant data.';
}
function boot(){
  if(/[?&]sample=1/.test(location.search)){P=genSample();banner();render();return}
  fetch('/api/staff/data',{credentials:'same-origin'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){P=d.participants;LIVE=true;banner();render()}).catch(function(){P=genSample();banner();render()});
}
boot();
})();
</script>
